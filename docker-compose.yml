services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: real_sporting
    ports:
      - "5432:5432"
    volumes:
      - real_sporting_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d real_sporting"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  real_sporting_pg:
