<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Sporting – Preloader</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  body { width:100vw; height:100vh; overflow:hidden; background:#060e08; }

  #preloader {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; overflow: hidden;
    background: #060e08;
  }

  /* BG PHOTO */
  .bg-photo {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    opacity: 0;
    transition: opacity 0.7s ease;
    filter: brightness(0.45) saturate(0.6) hue-rotate(-10deg);
  }
  .bg-photo.active { opacity: 1; }

  /* GREEN DARK OVERLAY */
  .bg-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(
      135deg,
      rgba(6,20,12,0.82) 0%,
      rgba(21,79,55,0.55) 50%,
      rgba(6,20,12,0.78) 100%
    );
    z-index: 1;
  }

  /* subtle vignette */
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(3,10,5,0.7) 100%);
    z-index: 2;
    pointer-events: none;
  }

  /* thin gold horizontal rule at vertical center */
  .center-rule {
    position: absolute;
    left: 0; right: 0;
    top: 50%; transform: translateY(-50%);
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(184,137,36,0.22), transparent);
    z-index: 3;
    pointer-events: none;
  }

  /* PANEL — the "cartel" */
  .panel {
    position: relative; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    width: 100%;
    padding: 0 clamp(16px, 5vw, 60px);
    transform: translateX(110vw) scaleX(0.08);
    transform-origin: right center;
    opacity: 0;
  }
  .panel.expand {
    animation: panelExpand 0.52s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  .panel.collapse {
    animation: panelCollapse 0.36s cubic-bezier(0.55,0,0.68,0.87) forwards;
  }
  @keyframes panelExpand {
    0%   { transform: translateX(110vw) scaleX(0.08); opacity:0; }
    35%  { opacity:1; }
    100% { transform: translateX(0) scaleX(1); opacity:1; }
  }
  @keyframes panelCollapse {
    0%   { transform: translateX(0) scaleX(1); opacity:1; }
    100% { transform: translateX(110vw) scaleX(0.08); opacity:0; }
  }

  /* THE WORD */
  .value-word {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: clamp(80px, 22vw, 180px);
    line-height: 0.88;
    letter-spacing: -0.01em;
    text-align: center;
    color: #f5f7f4;
    text-shadow:
      0 0 80px rgba(184,137,36,0.35),
      0 0 24px rgba(21,79,55,0.6),
      0 4px 8px rgba(0,0,0,0.8);
    opacity: 0;
    transform: translateY(18px);
    will-change: transform, opacity;
  }
  .value-word.appear {
    animation: wordUp 0.4s 0.28s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  @keyframes wordUp {
    to { opacity:1; transform:translateY(0); }
  }

  /* GOLD BAR */
  .gold-bar {
    height: 3px;
    width: 0%;
    background: linear-gradient(90deg, transparent, #b88924 30%, #d4a843 70%, transparent);
    margin: 14px auto 0;
    opacity: 0;
  }
  .gold-bar.appear {
    animation: barGrow 0.5s 0.44s ease forwards;
  }
  @keyframes barGrow {
    to { width: min(70%, 480px); opacity:1; }
  }

  /* TAGLINE */
  .tagline {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(12px, 2.6vw, 17px);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(184,137,36,0.82);
    margin-top: 12px;
    opacity: 0;
  }
  .tagline.appear {
    animation: fadeUp 0.4s 0.6s ease forwards;
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(6px); }
    to   { opacity:1; transform:translateY(0); }
  }

  /* BOTTOM BRAND STRIP */
  .brand-strip {
    position: absolute;
    bottom: clamp(20px,4vh,36px);
    left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    gap: 14px;
    z-index: 12;
    opacity: 0;
    animation: fadeUp 0.5s 0.8s ease forwards;
  }
  .brand-strip img {
    width: clamp(30px,5vw,42px);
    filter: drop-shadow(0 0 6px rgba(184,137,36,0.5));
  }
  .brand-strip span {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(10px,1.8vw,13px);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(184,137,36,0.7);
  }

  /* PROGRESS */
  .progress-track {
    position: absolute; bottom:0; left:0; right:0;
    height: 3px;
    background: rgba(255,255,255,0.05);
    z-index: 20;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #154f37, #b88924);
    width: 0%;
    transition: width 0.25s linear;
  }

  /* DOTS */
  .dots {
    position: absolute;
    top: clamp(16px,3vh,26px);
    right: clamp(16px,3vw,26px);
    display: flex; gap: 7px;
    z-index: 20;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,0.15);
    transition: background 0.3s, transform 0.3s;
  }
  .dot.active { background: #b88924; transform: scale(1.3); }

  /* DONE */
  #preloader.done {
    animation: fadeOut 0.55s ease forwards;
  }
  @keyframes fadeOut { to { opacity:0; pointer-events:none; } }
</style>
</head>
<body>
<div id="preloader">
  <div class="bg-photo" id="bgPhoto"></div>
  <div class="bg-overlay"></div>
  <div class="vignette"></div>
  <div class="center-rule"></div>

  <div class="dots" id="dots"></div>

  <div class="panel" id="panel">
    <div class="value-word" id="valueWord"></div>
    <div class="gold-bar"   id="goldBar"></div>
    <div class="tagline"    id="tagline"></div>
  </div>

  const values = [
    { word:'RESPETO',     bg: NINOS, tagline:'Fundamento del juego'      },
    { word:'DISCIPLINA',  bg: NINAS, tagline:'El camino al éxito'        },
    { word:'EMPATÍA',     bg: NINOS, tagline:'Unidos como equipo'        },
    { word:'PASIÓN',      bg: NINAS, tagline:'Corazón Real Sporting'     },
    { word:'LIDERAZGO',   bg: NINOS, tagline:'Formamos campeones'        },
  ];

  const TOTAL_MS  = 5000;
  const SLIDE_MS  = TOTAL_MS / values.length;

  const panel       = document.getElementById('panel');
  const valueWord   = document.getElementById('valueWord');
  const goldBar     = document.getElementById('goldBar');
  const tagline     = document.getElementById('tagline');
  const bgPhoto     = document.getElementById('bgPhoto');
  const progressFill= document.getElementById('progressFill');
  const dotsEl      = document.getElementById('dots');
  const preloader   = document.getElementById('preloader');

  values.forEach((_,i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i===0?' active':'');
    d.id = 'dot-'+i;
    dotsEl.appendChild(d);
  });

  function reflow(el) { void el.offsetWidth; }

  function resetAnim() {
    ['expand','collapse'].forEach(c => panel.classList.remove(c));
    ['appear'].forEach(c => {
      valueWord.classList.remove(c);
      goldBar.classList.remove(c);
      tagline.classList.remove(c);
    });
    reflow(panel); reflow(valueWord);
  }

  function showSlide(idx) {
    const v = values[idx];
    bgPhoto.classList.remove('active');
    bgPhoto.style.backgroundImage = `url(${v.bg})`;
    setTimeout(() => bgPhoto.classList.add('active'), 40);

    document.querySelectorAll('.dot').forEach((d,i) =>
      d.classList.toggle('active', i===idx));

    valueWord.textContent = v.word;
    tagline.textContent   = v.tagline;

    resetAnim();
    panel.classList.add('expand');
    setTimeout(() => {
      valueWord.classList.add('appear');
      goldBar.classList.add('appear');
      tagline.classList.add('appear');
    }, 30);
  }

  let current = 0, startTime = null;

  function nextSlide() {
    resetAnim();
    panel.classList.add('collapse');
    setTimeout(() => { current++; showSlide(current); }, 360);
  }

  function tick(ts) {
    if (!startTime) startTime = ts;
    const elapsed = ts - startTime;
    progressFill.style.width = Math.min(100, (elapsed/TOTAL_MS)*100) + '%';

    const target = Math.floor(elapsed / SLIDE_MS);
    if (target > current && current < values.length-1) nextSlide();

    if (elapsed < TOTAL_MS) {
      requestAnimationFrame(tick);
    } else {
      progressFill.style.width = '100%';
      setTimeout(() => {
        preloader.classList.add('done');
        setTimeout(() => preloader.remove(), 600);
      }, 200);
    }
  }

  showSlide(0);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
