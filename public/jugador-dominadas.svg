<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Barra de dominadas -->
  <rect x="30" y="40" width="140" height="8" rx="4" fill="#1a1a1a" opacity="0.8"/>
  
  <!-- Cabeza (oscura) -->
  <circle cx="100" cy="70" r="18" fill="#0a0a0a"/>
  
  <!-- Cuello -->
  <rect x="93" y="86" width="14" height="12" fill="#0a0a0a"/>
  
  <!-- Torso (oscuro) -->
  <ellipse cx="100" cy="120" rx="20" ry="28" fill="#0a0a0a"/>
  
  <!-- Brazos levantados (agarrando barra) -->
  <!-- Brazo izquierdo -->
  <g>
    <line x1="80" y1="90" x2="40" y2="50" stroke="#0a0a0a" stroke-width="8" stroke-linecap="round"/>
    <circle cx="40" cy="50" r="6" fill="#0a0a0a"/>
  </g>
  
  <!-- Brazo derecho -->
  <g>
    <line x1="120" y1="90" x2="160" y2="50" stroke="#0a0a0a" stroke-width="8" stroke-linecap="round"/>
    <circle cx="160" cy="50" r="6" fill="#0a0a0a"/>
  </g>
  
  <!-- Abdomen/core -->
  <ellipse cx="100" cy="135" rx="16" ry="20" fill="#0a0a0a" opacity="0.9"/>
  
  <!-- Piernas -->
  <!-- Pierna izquierda -->
  <line x1="90" y1="155" x2="85" y2="220" stroke="#0a0a0a" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Pierna derecha -->
  <line x1="110" y1="155" x2="115" y2="220" stroke="#0a0a0a" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Pies -->
  <ellipse cx="85" cy="225" rx="7" ry="6" fill="#0a0a0a"/>
  <ellipse cx="115" cy="225" rx="7" ry="6" fill="#0a0a0a"/>
</svg>