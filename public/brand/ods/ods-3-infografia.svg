  <text x="48" y="188" font-family="Arial Black, sans-serif" font-size="24" fill="#4C9F38">ODS 3 — Salud y Bienestar</text>
  <text x="48" y="232" font-family="Arial, sans-serif" font-size="19" fill="#1a241f">Promovemos la salud física y emocional mediante la práctica constante del fútbol.</text>
  <text x="48" y="312" font-family="Arial Black, sans-serif" font-size="17" fill="#4a5d50">ACCIONES DEL CLUB</text>
