  <text x="56" y="504" font-family="Arial, sans-serif" font-size="20" fill="#1a241f">🏃 Desarrollo físico integral</text>
  <text x="56" y="552" font-family="Arial, sans-serif" font-size="20" fill="#1a241f">🤝 Prevención de riesgos sociales mediante el deporte</text>
